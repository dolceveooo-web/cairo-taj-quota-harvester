name: Cloud Quota Harvester - Dokki (macOS Test)

# TEST: Using macOS runner - different IP range from Azure, WE may not block it
# Run separately to compare success rate vs ubuntu runner

on:
  workflow_dispatch:  # Manual trigger only for now

jobs:
  harvest:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd github-harvester
          npm install --no-audit

      - name: Find Chrome path
        run: |
          echo "CHROME_PATH=$CHROME_PATH"
          which chromium || true
          which chromium-browser || true
          which google-chrome || true
          ls /Applications/ | grep -i chrome || true
          ls /opt/hostedtoolcache/setup-chrome/ 2>/dev/null || true

      - name: Run Dokki harvester (macOS IP)
        env:
          FIREBASE_API_KEY:    ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          DOKKI_USERNAME:      ${{ secrets.DOKKI_USERNAME }}
          DOKKI_PASSWORD:      ${{ secrets.DOKKI_PASSWORD }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID:   ${{ secrets.TELEGRAM_GROUP_ID }}
        run: |
          cd github-harvester
          node harvester-dokki.js
