name: Cloud Quota Harvester API - Line 104

# Pure REST API harvester — no browser, no Puppeteer, no Chrome needed.
# Zero login blocks. Runs in ~5 seconds instead of 3-5 minutes.

on:
  schedule:
    - cron: '0 */2 * * *'   # Every 2 hours
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-api-${{ runner.os }}-${{ hashFiles('github-harvester/package.json') }}

      - name: Install dependencies
        run: |
          cd github-harvester
          npm install --prefer-offline --no-audit

      - name: Run API harvester — Line 104
        env:
          FIREBASE_API_KEY:    ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          WE_USERNAME:         ${{ secrets.WE_USERNAME }}
          WE_PASSWORD:         ${{ secrets.WE_PASSWORD }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID:   ${{ secrets.TELEGRAM_GROUP_ID }}
        run: |
          cd github-harvester
          node harvester-api.js
