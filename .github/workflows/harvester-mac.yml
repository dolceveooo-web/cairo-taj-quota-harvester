name: Cloud Quota Harvester - Line 104 (macOS Test)

on:
  workflow_dispatch:

jobs:
  harvest:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd github-harvester
          npm install --no-audit

      - name: Run Line 104 harvester (macOS IP)
        env:
          FIREBASE_API_KEY:    ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          WE_USERNAME:         ${{ secrets.WE_USERNAME }}
          WE_PASSWORD:         ${{ secrets.WE_PASSWORD }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID:   ${{ secrets.TELEGRAM_GROUP_ID }}
        run: |
          cd github-harvester
          CHROME=$(find /Users/runner/hostedtoolcache/setup-chrome -name "chrome" -type f 2>/dev/null | head -1)
          if [ -z "$CHROME" ]; then
            CHROME=$(find /opt/hostedtoolcache/setup-chrome -name "chrome" -type f 2>/dev/null | head -1)
          fi
          echo "Using Chrome: $CHROME"
          PUPPETEER_EXECUTABLE_PATH="$CHROME" node harvester.js
