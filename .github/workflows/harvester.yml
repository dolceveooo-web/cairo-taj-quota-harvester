name: Cloud Quota Harvester

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Cache Puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('github-harvester/package-lock.json') }}
      
      - name: Install dependencies
        run: |
          cd github-harvester
          npm ci --prefer-offline --no-audit --legacy-peer-deps
      
      - name: Run harvester
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          WE_USERNAME: ${{ secrets.WE_USERNAME }}
          WE_PASSWORD: ${{ secrets.WE_PASSWORD }}
        run: |
          cd github-harvester
          node harvester.js
